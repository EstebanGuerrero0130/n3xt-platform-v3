<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#0e1512;overflow:hidden}canvas{display:block}</style></head><body>
<script type="module">
import * as THREE from 'three'
import { RoomEnvironment } from 'three/examples/jsm/environments/RoomEnvironment.js'
import { mergeGeometries } from 'three/examples/jsm/utils/BufferGeometryUtils.js'
const P = new URLSearchParams(location.search)
const W = +P.get('w') || 1600, H = +P.get('h') || 1600
const color = P.get('c') || '#2b322f'
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true })
renderer.setPixelRatio(1); renderer.setSize(W, H)
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap
document.body.appendChild(renderer.domElement)
const scene = new THREE.Scene(); scene.background = new THREE.Color('#0e1512')
scene.fog = new THREE.Fog('#0e1512', 10, 20)
const pm = new THREE.PMREMGenerator(renderer)
scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture
scene.environmentIntensity = 0.22
const cam = new THREE.PerspectiveCamera(28, W / H, 0.1, 100); cam.position.set(0, 0.9, +P.get('z') || 7.2); cam.lookAt(0, 0.05, 0)

// Celosía voronoi: dual de una icoesfera con vértices desplazados (celdas irregulares)
const hash = (str) => { let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619) } return ((h >>> 0) % 10000) / 10000 }
const ico = new THREE.IcosahedronGeometry(1, +P.get('d') || 2)
const pos = ico.getAttribute('position')
const key = v => v.toArray().map(x => x.toFixed(4)).join(',')
const J = +P.get('j') || 0.09
const perturb = (v) => { const k = key(v); const t = new THREE.Vector3(hash(k + 'x') - .5, hash(k + 'y') - .5, hash(k + 'z') - .5).multiplyScalar(J * 2); return v.clone().add(t).normalize() }
const faces = []
for (let i = 0; i < pos.count; i += 3) {
  const raw = [0, 1, 2].map(k => new THREE.Vector3().fromBufferAttribute(pos, i + k))
  const p = raw.map(perturb)
  faces.push({ v: raw, c: p[0].clone().add(p[1]).add(p[2]).divideScalar(3).normalize() })
}
const edgeMap = new Map()
faces.forEach((f, fi) => { for (let k = 0; k < 3; k++) { const e = [key(f.v[k]), key(f.v[(k + 1) % 3])].sort().join('|'); (edgeMap.get(e) || edgeMap.set(e, []).get(e)).push(fi) } })
const R = 1.25
const nodes = faces.map(f => f.c.clone().multiplyScalar(R))
const parts = []
const r = +P.get('r') || 0.07
for (const [, fs] of edgeMap) {
  if (fs.length !== 2) continue
  const a = nodes[fs[0]], b = nodes[fs[1]]
  // arco ligeramente curvo sobre la esfera (como un voronoi impreso)
  const mid = a.clone().add(b).multiplyScalar(0.5).normalize().multiplyScalar(R * 1.01)
  const curve = new THREE.QuadraticBezierCurve3(a, mid, b)
  parts.push(new THREE.TubeGeometry(curve, 12, r, 18, false))
}
nodes.forEach(n => { const s = new THREE.SphereGeometry(r * 1.07, 24, 18); s.translate(n.x, n.y, n.z); parts.push(s) })
const lattice = mergeGeometries(parts.map(p => { const g = p.index ? p.toNonIndexed() : p; g.deleteAttribute('uv'); return g }), false)
const mat = new THREE.MeshPhysicalMaterial({ color, roughness: 0.5, metalness: 0.0, clearcoat: 0.12, clearcoatRoughness: 0.5, sheen: 0.0 })
// Líneas de capa FDM: perturbación de la normal según la altura en el mundo (~0.2 mm por capa)
mat.onBeforeCompile = (sh) => {
  sh.vertexShader = sh.vertexShader.replace('#include <common>', '#include <common>\nvarying float vWY;').replace('#include <worldpos_vertex>', '#include <worldpos_vertex>\nvWY = (modelMatrix * vec4(transformed, 1.0)).y;')
  sh.fragmentShader = sh.fragmentShader.replace('#include <common>', '#include <common>\nvarying float vWY;').replace('#include <normal_fragment_maps>', `#include <normal_fragment_maps>
  { float l = sin(vWY * ${(+P.get('lf') || 520).toFixed(1)}); vec3 upV = normalize((viewMatrix * vec4(0.0, 1.0, 0.0, 0.0)).xyz); normal = normalize(normal + upV * l * 0.16); }`)
}
const mesh = new THREE.Mesh(lattice, mat); mesh.castShadow = true; mesh.receiveShadow = true
mesh.rotation.set(0.3, 0.5, 0.05)
mesh.position.y = 0.1
scene.add(mesh)

const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshStandardMaterial({ color: '#0e1512', roughness: 0.9 }))
floor.rotation.x = -Math.PI / 2; floor.position.y = -1.28; floor.receiveShadow = true; scene.add(floor)

const key1 = new THREE.SpotLight('#f2f5f0', 95, 30, 0.45, 0.6); key1.position.set(-4, 7, 4); key1.castShadow = true; key1.shadow.mapSize.set(2048, 2048); key1.shadow.radius = 6; scene.add(key1)
const rim = new THREE.SpotLight('#3fcf72', 120, 30, 0.5, 0.7); rim.position.set(-4.5, 1.5, -4.5)
const rimW = new THREE.SpotLight('#ffffff', 70, 30, 0.5, 0.7); rimW.position.set(5, 3, -3.5); scene.add(rimW); scene.add(rim)
const rim2 = new THREE.PointLight('#08872b', 6, 8); rim2.position.set(0, -0.6, -2); scene.add(rim2)
const fill = new THREE.PointLight('#c8d2cb', 2, 20); fill.position.set(3, 1, 6); scene.add(fill)
renderer.render(scene, cam)
window.__done = true
</script></body></html>
