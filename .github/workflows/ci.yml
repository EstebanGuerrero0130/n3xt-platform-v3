# ============================================================
# N3XT Platform V3 — CI/CD Pipeline
# Runs on: push to main/develop, pull requests to main
# Stack: Laravel 13 (PHPUnit) + Vue 3 (Vite Build)
# ============================================================

name: N3XT CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────
  # Backend: PHP Tests (Laravel + PHPUnit)
  # ─────────────────────────────────────────────────────────
  backend-tests:
    name: 🧪 Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: n3xt_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐘 Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_pgsql, mbstring, xml, ctype, json, bcmath
          coverage: none

      - name: 📦 Cache Composer
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-

      - name: 📥 Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-progress

      - name: ⚙️ Prepare Environment
        run: |
          cp .env.example .env
          php artisan key:generate
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: n3xt_test
          DB_USERNAME: postgres
          DB_PASSWORD: postgres

      - name: 🗄️ Run Migrations
        run: php artisan migrate --force
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: n3xt_test
          DB_USERNAME: postgres
          DB_PASSWORD: postgres

      - name: ✅ Run PHPUnit
        run: php artisan test --parallel
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: n3xt_test
          DB_USERNAME: postgres
          DB_PASSWORD: postgres

  # ─────────────────────────────────────────────────────────
  # Frontend: Build Verification (Vue + Vite)
  # ─────────────────────────────────────────────────────────
  frontend-build:
    name: 🏗️ Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📦 Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📥 Install Dependencies
        run: npm ci

      - name: 🔍 Type & Lint Check
        run: npm run build -- --mode production
        env:
          VITE_API_URL: https://api.n3xt3d.com/api

      - name: 📊 Bundle Analysis
        run: |
          echo "## 📦 Build Output" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          du -sh dist/ >> $GITHUB_STEP_SUMMARY
          find dist -name "*.js" -exec du -sh {} \; | sort -rh | head -5 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  # ─────────────────────────────────────────────────────────
  # Security Audit
  # ─────────────────────────────────────────────────────────
  security-audit:
    name: 🔒 Security Audit
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔍 NPM Audit (Frontend)
        working-directory: frontend
        run: npm audit --audit-level=critical || true

      - name: 🔍 Composer Audit (Backend)
        working-directory: backend
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          composer audit || true
