# ============================================================
# N3XT Platform V3 — CI
# Corre en cada push y en cada pull request:
#   backend   → migraciones en Postgres (como Supabase) + PHPUnit
#   frontend  → ESLint, tipos, Vitest y build
#   e2e       → Playwright contra backend + build de producción
# ============================================================

name: CI

on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (PHPUnit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: n3xt_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_pgsql, pdo_sqlite, sqlite3, mbstring, xml, ctype, json, bcmath, fileinfo
          coverage: none

      - uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - run: composer install --no-interaction --prefer-dist --no-progress

      - name: Preparar .env
        run: |
          cp .env.example .env
          php artisan key:generate

      # Producción usa Postgres (Supabase): las migraciones deben correr ahí
      - name: Migraciones en Postgres
        run: php artisan migrate --force
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: n3xt_test
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          DB_SSLMODE: disable

      # Las pruebas usan SQLite en memoria (phpunit.xml)
      - name: PHPUnit
        run: php artisan test

  frontend:
    name: Frontend (lint, tipos, unitarias, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # package-lock.json no está en git: se instala desde package.json
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('frontend/package.json') }}
          restore-keys: npm-${{ runner.os }}-

      - run: npm install --no-audit --no-fund

      - name: ESLint
        run: npm run lint

      - name: Tipos (vue-tsc)
        run: npm run typecheck

      - name: Vitest
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      # Backend de prueba: SQLite en archivo, correos al log (de ahí se leen
      # los códigos) y caché en memoria (sin límites por minuto entre pruebas)
      DB_CONNECTION: sqlite
      DB_DATABASE: ${{ github.workspace }}/backend/database/e2e.sqlite
      DB_URL: ''
      SESSION_DRIVER: file
      CACHE_STORE: array
      MAIL_MAILER: log
      QUEUE_CONNECTION: sync
      ADMIN_PASSWORD: LocalAdmin_2026
      E2E_ADMIN_PASSWORD: LocalAdmin_2026
      E2E_MAIL_LOG: ${{ github.workspace }}/backend/storage/logs/laravel.log

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_sqlite, sqlite3, mbstring, xml, ctype, json, bcmath, fileinfo
          coverage: none

      - uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('frontend/package.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Instalar dependencias
        run: |
          (cd backend && composer install --no-interaction --prefer-dist --no-progress)
          (cd frontend && npm install --no-audit --no-fund && npx playwright install --with-deps chromium)

      - name: Base de datos de prueba
        working-directory: backend
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/e2e.sqlite
          php artisan migrate --seed --force

      - name: Levantar backend y frontend
        run: |
          (cd backend && php artisan serve --host=127.0.0.1 --port=8000 > /tmp/backend.log 2>&1 &)
          # Build de producción servido en el puerto del dev server (CORS y Sanctum ya lo aceptan)
          (cd frontend && npm run build && (npx vite preview --host localhost --port 5173 --strictPort > /tmp/frontend.log 2>&1 &))
          for url in http://127.0.0.1:8000/api/settings http://localhost:5173/; do
            timeout 60 bash -c "until curl -sf -o /dev/null $url; do sleep 1; done" || { echo "No respondió $url"; exit 1; }
          done

      - name: Playwright
        working-directory: frontend
        run: npx playwright test

      - name: Guardar trazas y logs si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-resultados
          path: |
            frontend/test-results/
            /tmp/backend.log
            /tmp/frontend.log
            backend/storage/logs/laravel.log
          retention-days: 7

  security-audit:
    name: Auditoría de dependencias
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: npm audit (solo críticas)
        working-directory: frontend
        run: npm install --no-audit --no-fund && npm audit --audit-level=critical || true

      - name: composer audit
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --no-progress && composer audit || true
